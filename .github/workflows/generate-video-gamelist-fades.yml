name: Generate Video gamelist fades

on:
  push:
    branches:
      - video-gamelist-mode
    paths:
      - scripts/generate_video_gamelist_fades.py
      - .github/workflows/generate-video-gamelist-fades.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: video-gamelist-mode
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Generate backdrop-matched fades
        run: python scripts/generate_video_gamelist_fades.py

      - name: Upload generated files for verification
        uses: actions/upload-artifact@v4
        with:
          name: video-gamelist-fades
          path: |
            assets/video_gamelist_gradient
            inc/globals.xml
            inc/globalsGL.xml
            tools/theme.xml

      - name: Commit generated fades
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/video_gamelist_gradient inc/globals.xml inc/globalsGL.xml tools/theme.xml
          if git diff --cached --quiet; then
            echo "Nothing changed"
            exit 0
          fi
          git commit -m "Add backdrop-matched Video gamelist fades"
          git push origin HEAD:video-gamelist-mode
